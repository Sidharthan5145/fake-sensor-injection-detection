<!DOCTYPE html>
<html>
<head>
  <title>Fake Sensor Data Detection</title>
</head>
<body>
  <h2>Fake Sensor Data Injection Detection</h2>

  <p id="result">Waiting for data...</p>

  <script>
    async function fetchData() {
      const response = await fetch("http://localhost:5000/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({temp: 30, hum: 60})
      });
      const data = await response.json();
      document.getElementById("result").innerHTML =
        `Temp: ${data.temperature} | Hum: ${data.humidity} <br> Status: ${data.status}`;
    }

    setInterval(fetchData, 3000);
  </script>
</body>
</html>
